spring.application.name=Calibrations-CafeLab

# PostgreSQL exclusivo del bounded context Calibrations.
# DB_URL es la URL JDBC completa del proyecto/base destino (ver .env.example).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${SERVER_PORT:8086}

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=com.acme.calibrationscafelab.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Documentation
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# Eureka Client
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761}/eureka
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${WEBSITE_HOSTNAME:localhost}
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=443
eureka.instance.non-secure-port-enabled=false

# Flyway
spring.flyway.enabled=false