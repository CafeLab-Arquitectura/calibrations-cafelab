name: Build Calibrations-CafeLab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: calibrations-cafelab
          path: target/Calibrations-CafeLab-*.jar
